name: Deploy to HF Space

# Mirror the Space files (space/, assets/, benchmarks/) from qverify main to the
# Hugging Face Space Laborator/qverify via the huggingface_hub HTTP API
# (Bearer auth). git-over-HTTPS push is rejected from GitHub Actions runners
# regardless of token/credential mechanism, so we upload over the API instead.
# Requires the repository secret HF_TOKEN (write scope on the Space). See
# docs/deploy.md.

on:
  push:
    branches: [main]
    paths:
      - "space/**"
      - "assets/**"
      - "benchmarks/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-hf-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qverify
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install -q "huggingface_hub>=0.25"

      - name: Build deploy payload
        run: |
          # Assemble the Space tree under ./hf-space: mirror space/ to the root,
          # then re-copy assets/ and benchmarks/ from the repo root.
          mkdir -p hf-space
          rsync -av --delete --exclude='.git/' --exclude='__pycache__/' \
            --exclude='assets/' --exclude='benchmarks/' \
            space/ hf-space/
          rsync -av --delete assets/ hf-space/assets/
          rsync -av --delete benchmarks/ hf-space/benchmarks/

      - name: Upload to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          commit = api.upload_folder(
              folder_path="hf-space",
              repo_id="Laborator/qverify",
              repo_type="space",
              commit_message=f"deploy: sync from qverify {os.environ.get('GITHUB_SHA', '')[:7]}",
          )
          print(f"Deployed: {commit}")
          PY
