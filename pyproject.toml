[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qverify"
version = "0.1.0"
description = "Quantum-verified reasoning for thinking-mode LLMs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Serghei Brinza", email = "contact@example.com" },
]
keywords = [
    "quantum-computing",
    "llm",
    "reasoning",
    "grover",
    "qiskit",
    "pennylane",
    "gemma",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.50",
    "accelerate>=1.0",
    "peft>=0.13",
    "bitsandbytes>=0.44",
    "qiskit>=2.0",
    "qiskit-ibm-runtime>=0.40",
    "pennylane>=0.39",
    "pennylane-qiskit>=0.39",
    "gradio>=5.0",
    "hydra-core>=1.3",
    "wandb>=0.18",
    "python-dotenv>=1.0",
    "numpy<2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "ipykernel>=6.29",
]

[project.urls]
Homepage = "https://github.com/Quantum-Labor/qverify"
Repository = "https://github.com/Quantum-Labor/qverify"
Issues = "https://github.com/Quantum-Labor/qverify/issues"

[tool.setuptools.packages.find]
include = ["qverify*"]
exclude = ["tests*", "demo*", "notebooks*", "benchmarks*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "RUF"]
# RUF001/002/003 flag mathematical Unicode (∧ ∨ ¬ ⊤) as ambiguous; we use
# these symbols intentionally as logic notation throughout the codebase.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "qverify.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests requiring real hardware or network access",
    "gpu: tests requiring CUDA-capable GPU",
]

[tool.coverage.run]
source = ["qverify"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
